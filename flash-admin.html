<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - FF Proxy Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-art" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="container" style="margin-top: 50px;">
        <div class="header">
            <h1>🔐 সিক্রেট এডমিন প্যানেল</h1>
            <p>আপনার সাইটের লিংক ও সেটিংস পরিচালনা করুন</p>
        </div>
        <div class="content-body" style="text-align: left;">
            <div id="auth-box">
                <div class="form-group">
                    <label>এডমিন পাসওয়ার্ড দিন:</label>
                    <input type="password" id="admin-pass-input" placeholder="পাসওয়ার্ড লিখুন (ডিফল্ট: admin123)">
                </div>
                <button class="btn" onclick="authenticateAdmin()">লগইন করুন</button>
            </div>

            <div id="admin-controls" style="display: none;">
                <div class="form-group"><label>ডাইরেক্ট এড লিংক:</label><input type="text" id="admin-direct-link"></div>
                <div class="form-group"><label>সেটআপ / নিয়মের ভিডিও লিংক (ফাঁকা রাখলে বাটন দেখাবে না):</label><input type="text" id="admin-video-link" placeholder="https://youtube.com/..."></div>
                <div class="form-group"><label>আনলক ফাইল বদলাতে চাইলে নতুন ফাইল বাছুন (ছোট ফাইল, ~১ MB পর্যন্ত):</label><input type="file" id="admin-file"><small id="file-info" style="color:var(--muted)"></small></div>
                <button class="btn" onclick="generateConfig()">⚙️ কনফিগ তৈরি করুন</button>
                <div class="form-group" style="margin-top:16px"><label>নিচের কোড দিয়ে হোস্টিংয়ের <b>js/site-config.js</b> ফাইলটি রিপ্লেস করুন:</label><textarea id="admin-out" rows="6" readonly style="width:100%;padding:10px;background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px"></textarea></div>
                <button class="btn" style="background: linear-gradient(135deg, #2ed573, #10ac84);" onclick="downloadConfig()">⬇️ site-config.js ডাউনলোড</button>
            </div>
        </div>
    </div>
    <script src="js/site-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
